<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scratchly live counter</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:transparent}
a{display:block;text-decoration:none;color:#F2F4FF;padding:16px 18px;border-radius:16px;background:linear-gradient(160deg,#16143A,#0A0A1C);border:1px solid #2A2758;min-height:130px}
.b{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.3px}
.b img{width:24px;height:24px;border-radius:50%}
.k{margin-top:12px;font-size:12px;color:#8F98C0}
.v{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin-top:2px;background:linear-gradient(100deg,#8B6CFF,#2DE2E6);-webkit-background-clip:text;background-clip:text;color:transparent}
.s{margin-top:8px;font-size:12px;color:#98A1C8}
.s b{color:#fff;font-weight:600}
</style></head>
<body>
<a href="https://app.scratchly.cfd" target="_blank" rel="noopener">
  <div class="b"><img src="logo.png" alt="">scratchly</div>
  <div class="k">SOL reclaimed through Scratchly</div>
  <div class="v" id="v">0 SOL</div>
  <div class="s"><b id="a">0</b> accounts closed, <b id="w">0</b> wallets</div>
</a>
<script>
fetch("stats.json?t=" + Date.now()).then(r => r.json()).then(s => {
  const sol = (s.totalReclaimed || 0) / 1e9;
  document.getElementById("v").textContent = (sol === 0 ? "0" : sol.toFixed(sol >= 100 ? 1 : sol >= 1 ? 3 : 4)) + " SOL";
  document.getElementById("a").textContent = (s.accounts || 0).toLocaleString("en-US");
  document.getElementById("w").textContent = (s.wallets || 0).toLocaleString("en-US");
}).catch(() => {});
</script>
</body></html>
