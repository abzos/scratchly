name: Update stats
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run stats
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: node stats.js
      - name: Commit
        run: |
          git config user.name "scratchly-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "update stats" && git push)
